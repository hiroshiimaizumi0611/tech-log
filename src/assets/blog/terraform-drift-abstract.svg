<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Terraform drift abstract visualization</title>
  <desc id="description">Offset infrastructure layers connected by a bright reconciliation path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111824" />
      <stop offset="1" stop-color="#090d13" />
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ea1ff" stop-opacity=".54" />
      <stop offset="1" stop-color="#8cc5ff" stop-opacity=".08" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#8cc5ff" stroke-opacity=".09" />
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#background)" />
  <rect width="960" height="540" fill="url(#grid)" />
  <g fill="url(#layer)" stroke="#8cc5ff" stroke-opacity=".72" stroke-width="3">
    <path d="m170 155 215-94 215 94-215 95z" />
    <path d="m360 294 215-94 215 94-215 95z" opacity=".72" />
    <path d="m170 378 215-94 215 94-215 95z" opacity=".4" />
  </g>
  <path d="M385 155v223c0 34 27 61 61 61h129" fill="none" stroke="#f5f7fa" stroke-width="7" stroke-linecap="round" />
  <circle cx="385" cy="155" r="13" fill="#4ea1ff" stroke="#f5f7fa" stroke-width="5" />
  <circle cx="575" cy="439" r="13" fill="#4ea1ff" stroke="#f5f7fa" stroke-width="5" />
  <g fill="#8cc5ff">
    <circle cx="702" cy="118" r="5" />
    <circle cx="750" cy="118" r="5" opacity=".55" />
    <circle cx="798" cy="118" r="5" opacity=".25" />
  </g>
</svg>
