<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">PluginとAppの権限確認フロー</title>
  <desc id="description">Pluginの導入方針からApp設定、ユーザー認証、接続先サービスの元権限、操作確認までを順に確認する。</desc>
  <rect width="1200" height="675" fill="#07090d" />
  <text
    x="60"
    y="76"
    fill="#f5f7fa"
    font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif"
    font-size="48"
    font-weight="750"
  >
    権限は5段階で確認する
  </text>
  <text x="60" y="120" fill="#a6afbc" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif" font-size="26">
    Pluginを入れただけで、接続先の権限が増えるわけではありません
  </text>

  <path d="M120 345H1080" stroke="#202936" stroke-width="8" stroke-linecap="round" />
  <g font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif">
    <g>
      <circle cx="132" cy="345" r="54" fill="#0b0f14" stroke="#4ea1ff" stroke-width="5" />
      <text x="132" y="358" text-anchor="middle" fill="#8cc5ff" font-size="38" font-weight="800">1</text>
      <text x="132" y="445" text-anchor="middle" fill="#f5f7fa" font-size="30" font-weight="700">Pluginの</text>
      <text x="132" y="487" text-anchor="middle" fill="#f5f7fa" font-size="30" font-weight="700">導入方針</text>
    </g>
    <path d="m252 325 20 20-20 20" fill="none" stroke="#8cc5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <g>
      <circle cx="360" cy="345" r="54" fill="#0b0f14" stroke="#4ea1ff" stroke-width="5" />
      <text x="360" y="358" text-anchor="middle" fill="#8cc5ff" font-size="38" font-weight="800">2</text>
      <text x="360" y="437" text-anchor="middle" fill="#f5f7fa" font-size="30" font-weight="700">Appの</text>
      <text x="360" y="475" text-anchor="middle" fill="#f5f7fa" font-size="24" font-weight="700">Workspace・Role</text>
      <text x="360" y="511" text-anchor="middle" fill="#f5f7fa" font-size="28" font-weight="700">設定</text>
    </g>
    <path d="m480 325 20 20-20 20" fill="none" stroke="#8cc5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <g>
      <circle cx="588" cy="345" r="54" fill="#0b0f14" stroke="#4ea1ff" stroke-width="5" />
      <text x="588" y="358" text-anchor="middle" fill="#8cc5ff" font-size="38" font-weight="800">3</text>
      <text x="588" y="445" text-anchor="middle" fill="#f5f7fa" font-size="30" font-weight="700">ユーザー認証</text>
    </g>
    <path d="m708 325 20 20-20 20" fill="none" stroke="#8cc5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <g>
      <circle cx="816" cy="345" r="54" fill="#0b0f14" stroke="#4ea1ff" stroke-width="5" />
      <text x="816" y="358" text-anchor="middle" fill="#8cc5ff" font-size="38" font-weight="800">4</text>
      <text x="816" y="437" text-anchor="middle" fill="#f5f7fa" font-size="28" font-weight="700">接続先</text>
      <text x="816" y="475" text-anchor="middle" fill="#f5f7fa" font-size="25" font-weight="700">サービスの元権限</text>
    </g>
    <path d="m936 325 20 20-20 20" fill="none" stroke="#8cc5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <g>
      <circle cx="1044" cy="345" r="54" fill="#0b0f14" stroke="#4ea1ff" stroke-width="5" />
      <text x="1044" y="358" text-anchor="middle" fill="#8cc5ff" font-size="38" font-weight="800">5</text>
      <text x="1044" y="445" text-anchor="middle" fill="#f5f7fa" font-size="30" font-weight="700">操作確認</text>
    </g>
  </g>

  <rect x="60" y="558" width="1080" height="62" rx="18" fill="#0b0f14" stroke="#202936" stroke-width="2" />
  <text
    x="600"
    y="601"
    text-anchor="middle"
    fill="#a6afbc"
    font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif"
    font-size="28"
  >
    各段階の設定と元の権限を確認して、最後に実操作を試します
  </text>
</svg>
